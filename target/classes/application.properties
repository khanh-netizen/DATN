# Server Port Configuration
server.port=8080

# Shared image/video storage (override these paths in production)
app.media.root=${MEDIA_ROOT:../../image}
app.media.public-url=${MEDIA_PUBLIC_URL:https://datn-08zh.onrender.com}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Database Connection Settings (Microsoft SQL Server - SQL Server Authentication)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=foxstyle_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Spring Data JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
app.seed-demo-data=${SEED_DEMO_DATA:false}
app.repair-database-encoding=${REPAIR_DATABASE_ENCODING:true}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JSON representation of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
# The environment variable should be set in production. The fallback key is
# Base64-encoded and intended only for local development.
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.jwt.expiration-ms=86400000

# Swagger Configuration
springdoc.swagger-ui.path=/swagger

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Force use of national character sets (NVARCHAR/NCHAR) for SQL Server Vietnamese unicode support
spring.jpa.properties.hibernate.use_national_character_character_sets=true

# PayOS Payment Gateway Configuration
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

